<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arambh — Reminders</title>
  <meta name="description" content="Create and manage reminders, tasks, and to-dos with priority levels and due dates." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .reminders-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: var(--transition);
      position: relative;
    }

    .task-card:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }

    .task-card.priority-high { border-left: 3px solid var(--red); }
    .task-card.priority-medium { border-left: 3px solid var(--yellow); }
    .task-card.priority-low { border-left: 3px solid var(--green); }

    .task-card.completed {
      opacity: 0.55;
      border-left-color: var(--text-muted) !important;
    }

    .task-card.completed .task-title { text-decoration: line-through; }

    .task-header { display: flex; align-items: flex-start; gap: 12px; }

    .task-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: var(--transition);
    }

    .task-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-size: 12px;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      line-height: 1.3;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-left: 32px;
      flex-wrap: wrap;
    }

    .task-desc {
      font-size: 12px;
      color: var(--text-muted);
      padding-left: 32px;
      margin-top: 4px;
    }

    .task-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: var(--transition);
    }

    .task-card:hover .task-actions { opacity: 1; }

    .overdue-pill {
      background: var(--red-bg);
      color: var(--red);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .tasks-grid { display: flex; flex-direction: column; gap: 10px; }

    .priority-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 8px;
    }

    @media (max-width: 900px) { .reminders-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <main class="page-body">
        <h1 class="section-title mb-6">🔔 Reminders & Tasks</h1>
        <div class="reminders-layout">
          <!-- Left: Create Form -->
          <div style="display:flex;flex-direction:column;gap:20px">
            <div class="card">
              <div class="card-title">➕ New Task</div>
              <div class="modal-form" id="taskForm">
                <div class="form-group">
                  <label class="form-label">Task Title *</label>
                  <input type="text" class="form-input" id="taskTitle" placeholder="What needs to be done?" />
                </div>
                <div class="form-group">
                  <label class="form-label">Due Date *</label>
                  <input type="date" class="form-input" id="taskDueDate" />
                </div>
                <div class="form-group">
                  <label class="form-label">Priority</label>
                  <div class="flex gap-2" id="prioritySelector">
                    <button class="btn btn-secondary btn-sm flex-1" data-priority="low" id="pri-low">🟢 Low</button>
                    <button class="btn btn-secondary btn-sm flex-1 active-pri" data-priority="medium" id="pri-medium" style="border-color:var(--yellow);color:var(--yellow)">🟡 Medium</button>
                    <button class="btn btn-secondary btn-sm flex-1" data-priority="high" id="pri-high">🔴 High</button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Description (optional)</label>
                  <textarea class="form-input" id="taskDesc" rows="3" placeholder="Additional details..."></textarea>
                </div>
                <button class="btn btn-primary w-full" id="addTaskBtn">+ Add Task</button>
              </div>
            </div>

            <!-- Stats -->
            <div class="card">
              <div class="card-title">📊 Summary</div>
              <div id="taskStats"></div>
            </div>
          </div>

          <!-- Right: Tasks List -->
          <div style="display:flex;flex-direction:column;gap:16px">
            <!-- View Tabs -->
            <div class="flex justify-between items-center">
              <div class="tabs" id="viewTabs">
                <button class="tab-btn active" data-view="upcoming">Upcoming</button>
                <button class="tab-btn" data-view="priority">By Priority</button>
                <button class="tab-btn" data-view="completed">Completed</button>
              </div>
              <span id="taskCount" style="font-size:13px;color:var(--text-muted)"></span>
            </div>

            <div id="tasksContainer"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/reminders.js"></script>
</body>
</html>
