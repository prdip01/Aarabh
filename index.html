<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arambh — Dashboard</title>
  <meta name="description" content="Arambh personal productivity dashboard — your all-in-one study, money, reminders, and projects hub." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* ── Dashboard-specific ── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
    }

    .summary-card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .summary-card-info { flex: 1; min-width: 0; }
    .summary-card-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .summary-card-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .summary-card-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Calendar ── */
    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .calendar-nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cal-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .cal-nav-btn:hover { border-color: var(--border); color: var(--text-primary); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-name {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 0;
      text-transform: uppercase;
    }

    .cal-day {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: default;
      transition: var(--transition);
    }

    .cal-day:not(.empty):hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .cal-day.today {
      background: var(--accent);
      color: white;
      font-weight: 700;
      box-shadow: var(--shadow-accent);
    }

    .cal-day.other-month { color: var(--text-muted); opacity: 0.4; }

    .cal-day.has-reminder::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 7px 7px 0;
      border-color: transparent var(--red) transparent transparent;
      border-radius: 2px;
    }

    .cal-day.today.has-reminder::after {
      border-color: transparent rgba(255,255,255,0.9) transparent transparent;
    }

    /* ── Main dashboard layout ── */
    .dashboard-main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    .dashboard-left { display: flex; flex-direction: column; gap: 20px; }
    .dashboard-right { display: flex; flex-direction: column; gap: 20px; }

    /* ── Quick Links ── */
    .quick-links-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .quick-link-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .quick-link-icon { font-size: 16px; }

    /* ── Upcoming Tasks Widget ── */
    .task-item-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .task-item-mini:last-child { border-bottom: none; }

    .task-priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .priority-high { background: var(--red); }
    .priority-medium { background: var(--yellow); }
    .priority-low { background: var(--green); }

    .task-mini-title {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-mini-date {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .task-mini-overdue { color: var(--red); }

    @media (max-width: 900px) {
      .dashboard-main { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .dashboard-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <main class="page-body">
        <div class="dashboard-main">
          <!-- Left Column -->
          <div class="dashboard-left">
            <!-- Summary Cards 2x2 -->
            <div class="dashboard-grid" id="summaryCards"></div>

            <!-- Calendar -->
            <div class="calendar-card">
              <div class="calendar-header">
                <span class="calendar-title" id="calMonthTitle"></span>
                <div class="calendar-nav">
                  <button class="cal-nav-btn" id="calPrev">‹</button>
                  <button class="cal-nav-btn" id="calToday" title="Today" style="font-size:10px;width:auto;padding:0 8px;">Today</button>
                  <button class="cal-nav-btn" id="calNext">›</button>
                </div>
              </div>
              <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <!-- Quick Links -->
            <div class="card">
              <div class="flex justify-between items-center mb-4">
                <div class="card-title" style="margin-bottom:0">⚡ Quick Links</div>
                <div class="flex gap-2">
                  <button class="btn btn-primary btn-sm" id="addQuickLinkDashBtn">+ Add Link</button>
                  <a href="settings.html#links" class="btn btn-secondary btn-sm" title="Manage all links">⚙️</a>
                </div>
              </div>
              <div class="quick-links-grid" id="quickLinksGrid"></div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="dashboard-right">
            <!-- Upcoming Tasks -->
            <div class="card">
              <div class="flex justify-between items-center mb-4">
                <div class="card-title" style="margin-bottom:0">📋 Upcoming Tasks</div>
                <a href="reminders.html" class="btn btn-secondary btn-sm">View All</a>
              </div>
              <div id="upcomingTasksList"></div>
            </div>

            <!-- Study Today -->
            <div class="card">
              <div class="flex justify-between items-center mb-4">
                <div class="card-title" style="margin-bottom:0">📚 Study Today</div>
                <a href="study.html" class="btn btn-secondary btn-sm">Log</a>
              </div>
              <div id="studyTodayWidget"></div>
            </div>

            <!-- Budget Status -->
            <div class="card">
              <div class="flex justify-between items-center mb-4">
                <div class="card-title" style="margin-bottom:0">💰 Budget Status</div>
                <a href="money.html" class="btn btn-secondary btn-sm">View</a>
              </div>
              <div id="budgetWidget"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Quick Link Modal -->
  <div class="modal-overlay" id="quickLinkModal">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h2 class="modal-title" id="qlModalTitle">Add Quick Link</h2>
        <button class="modal-close" onclick="closeModal('quickLinkModal')">✕</button>
      </div>
      <div class="modal-form">
        <input type="hidden" id="editLinkId" />
        <div class="form-group">
          <label class="form-label">Icon (emoji)</label>
          <input type="text" class="form-input" id="qlIcon" placeholder="🔗" maxlength="2" style="font-size:22px;text-align:center;width:72px" />
        </div>
        <div class="form-group">
          <label class="form-label">Link Name *</label>
          <input type="text" class="form-input" id="qlName" placeholder="e.g. YouTube" />
        </div>
        <div class="form-group">
          <label class="form-label">URL *</label>
          <input type="url" class="form-input" id="qlUrl" placeholder="https://youtube.com" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('quickLinkModal')">Cancel</button>
        <button class="btn btn-primary" id="saveQuickLinkBtn">Save Link</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
